# 安全模式：仅使用国外解析结果；失败和负回答保持原样，不写永久无地址记忆。
plugins:
  - tag: sequence_not_in_list_noleak_v4
    type: sequence
    args:
      - exec: $sequence_google_node
      - matches: "!resp_ip 0.0.0.0/0"
        exec: $sequence_google
      - matches: "!rcode 0"
        exec: exit
      - matches: "!resp_ip 0.0.0.0/0"
        exec: exit
      - exec: fast_mark 30
      - exec: $sequence_not_in_list_ipmatch
